# cargo-audit configuration
# See: https://docs.rs/cargo-audit/latest/cargo_audit/config/

[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing sidechannel in `rsa` crate (v0.9.10)
# - Transitive dependency: prtip-scanner -> sqlx -> sqlx-mysql -> rsa
# - No patched version available upstream
# - Risk accepted: SPECTRE does not use RSA for network-exposed operations;
#   the crate is pulled in by sqlx-mysql's TLS handshake support
ignore = [
    "RUSTSEC-2023-0071",

    # GTK3 ecosystem - no longer maintained (migrated to GTK4)
    # Impact: Low - GUI runs locally with trusted input, Tauri actively maintained
    # Tracking: Wait for Tauri migration to GTK4 bindings (gtk-rs 0.19+)
    # References:
    # - https://gtk-rs.org/gtk4-rs/ (GTK4 bindings are actively maintained)
    # - https://github.com/tauri-apps/tauri/issues (Tauri tracking GTK4 migration)
    "RUSTSEC-2024-0413",  # atk - GTK3 bindings unmaintained
    "RUSTSEC-2024-0416",  # atk-sys - GTK3 bindings unmaintained
    "RUSTSEC-2024-0412",  # gdk - GTK3 bindings unmaintained
    "RUSTSEC-2024-0418",  # gdk-sys - GTK3 bindings unmaintained
    "RUSTSEC-2024-0411",  # gdkwayland-sys - GTK3 bindings unmaintained
    "RUSTSEC-2024-0417",  # gdkx11 - GTK3 bindings unmaintained
    "RUSTSEC-2024-0414",  # gdkx11-sys - GTK3 bindings unmaintained
    "RUSTSEC-2024-0415",  # gtk - GTK3 bindings unmaintained
    "RUSTSEC-2024-0420",  # gtk-sys - GTK3 bindings unmaintained
    "RUSTSEC-2024-0419",  # gtk3-macros - GTK3 bindings unmaintained
    "RUSTSEC-2024-0370",  # proc-macro-error - used by gtk3-macros, unmaintained
    "RUSTSEC-2024-0429",  # glib - unsound VariantStrIter (not used by SPECTRE)

    # Tauri utilities - unmaintained Unicode crates
    # Impact: Low - no known vulnerabilities, used for URL pattern matching
    # Note: Used by urlpattern -> tauri-utils for URL validation
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0100",  # unic-ucd-ident
    "RUSTSEC-2025-0098",  # unic-ucd-version

    # Other unmaintained crates with low risk
    "RUSTSEC-2025-0057",   # fxhash - used by HTML parsing (selectors), no known vulns
    "RUSTSEC-2025-0119",   # number_prefix - used by indicatif progress bars, cosmetic
    "RUSTSEC-2025-0141",   # bincode - used by WRAITH discovery (internal comms only)

    # RUSTSEC-2026-0194/0195: quick-xml 0.38.4 quadratic runtime / memory exhaustion
    # - Transitive: tauri 2.11.5 (latest) -> plist 1.8.0 -> quick-xml 0.38.4
    # - Only used for macOS Info.plist bundle-metadata parsing at build/packaging time,
    #   not attacker-reachable network input
    # - No fix available: tauri's own `plist` dependency hasn't moved to quick-xml >=0.41.0
    #   yet; re-check on the next tauri/plist release and remove this entry once resolved
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
