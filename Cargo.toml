[workspace]
resolver = "2"
members = [
    "crates/spectre-cli",
    "crates/spectre-core",
    "crates/spectre-tui",
    "crates/spectre-gui",
    "crates/spectre-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["doublegate"]
license = "MIT"
repository = "https://github.com/doublegate/SPECTRE"
homepage = "https://github.com/doublegate/SPECTRE"
documentation = "https://docs.rs/spectre"
keywords = ["security", "scanning", "encryption", "red-team", "offensive-security"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "color", "suggestions"] }
clap_complete = "4.5"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Networking
ipnetwork = "0.20"

# Crypto (for WRAITH integration)
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Directories
directories = "6"

# Docker API (for CyberChef-MCP)
bollard = "0.18"

# Output formatting
colored = "3"
comfy-table = "7"
indicatif = "0.17"

# Testing
proptest = "1.5"
criterion = "0.5"
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = true
codegen-units = 1
