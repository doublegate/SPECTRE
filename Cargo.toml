[workspace]
resolver = "2"
members = [
    "crates/spectre-cli",
    "crates/spectre-core",
    "crates/spectre-tui",
    "crates/spectre-gui",
    "crates/spectre-mcp",
]
exclude = [
    "components/prtip",
    "components/wraith-protocol",
]

[workspace.package]
version = "0.5.0-beta.1"
edition = "2021"
rust-version = "1.92"
authors = ["doublegate"]
license = "MIT"
repository = "https://github.com/doublegate/SPECTRE"
homepage = "https://github.com/doublegate/SPECTRE"
documentation = "https://docs.rs/spectre"
keywords = ["security", "scanning", "encryption", "red-team", "offensive-security"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "color", "suggestions"] }
clap_complete = "4.5"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
toml_edit = "0.25"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Networking
ipnetwork = { version = "0.21", features = ["serde"] }

# Database
# NOTE: pinned to 0.32 by a shared `links = "sqlite3"` constraint with prtip-scanner's
# `sqlx = "0.8"` (sqlx-sqlite 0.8.x requires libsqlite3-sys ^0.30.1; rusqlite >=0.33 requires
# libsqlite3-sys >=0.31, which conflicts). Bumping past 0.32 requires prtip to move to sqlx 0.9+
# first (out of scope here — separate submodule/repo).
rusqlite = { version = "0.32", features = ["bundled"] }

# Plugin system
# NOTE: pinned to 0.11 by a shared `links = "lua"` constraint with prtip-scanner's own
# internal `mlua = "0.11"` (mlua-sys bumps its native-lib minor version on every mlua release,
# so mlua 0.12 needs mlua-sys ^0.11 while prtip's highest 0.11.x needs mlua-sys ^0.10 — no
# overlap). Bumping past 0.11 requires prtip to move first (out of scope — separate submodule).
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "send", "serialize"] }

# ProRT-IP scanner integration
prtip-core = { path = "components/prtip/crates/prtip-core" }
prtip-scanner = { path = "components/prtip/crates/prtip-scanner" }

# WRAITH-Protocol communications integration
wraith-core = { path = "components/wraith-protocol/crates/wraith-core" }
wraith-crypto = { path = "components/wraith-protocol/crates/wraith-crypto" }

# Utilities
uuid = { version = "1.0", features = ["v4"] }
tokio-util = "0.7"
quick-xml = "0.41"

# Crypto (for WRAITH integration)
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
hex = "0.4"
urlencoding = "2.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Directories
directories = "6"

# Docker API (for CyberChef-MCP)
bollard = "0.21"

# GUI (Tauri 2.0)
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"

# Output formatting
colored = "3"
comfy-table = "7"
indicatif = "0.18"

# Testing
proptest = "1.5"
criterion = "0.8"
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = true
codegen-units = 1
