version: 2
updates:
  # Rust dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "doublegate"
    groups:
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "doublegate"
    ignore:
      # dtolnay/rust-toolchain uses ref tags for Rust compiler versions (e.g. @1.99.0, @stable),
      # which Dependabot misparses into non-existent tags like 1.120.0.
      - dependency-name: "dtolnay/rust-toolchain"

  # npm dependencies (GUI frontend)
  - package-ecosystem: "npm"
    directory: "/crates/spectre-gui/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "javascript"
    reviewers:
      - "doublegate"
    groups:
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
